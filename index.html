      <div class="boot" id="boot-error">
        <h1>脚本没能加载</h1>
        <p class="dim">
          本页面的全部计算都在浏览器里完成，需要一个能提供页面的地址。请任选一种：<br /><br />

          <code>python -m http.server 8000</code><br /><br />
          <b>2. 用自包含版本</b>：仓库根的 <code>index.html</code> 由 <code>pnpm build</code>
          生成，已把 JS/CSS 内联进同一个文件，双击即可打开。
        </p>
      </div>

    <noscript>
      <div class="boot">

        <p class="dim">本页面的全部计算都在浏览器里完成。</p>
      </div>
    </noscript>
    <script>
      // 兜底：若 module 脚本没能执行（file:// 被 CORS 拦、或加载失败），
      // 把「正在加载…」换成可操作的指引，而不是留一个空白页。
      setTimeout(function () {
        var app = document.getElementById('app');
        if (!app || app.dataset.mounted === '1') return;
        var hint = document.getElementById('boot-hint');
        if (hint) hint.style.display = 'none';
        var err = document.getElementById('boot-error');
        if (err) err.style.display = 'block';
      }, 1200);
